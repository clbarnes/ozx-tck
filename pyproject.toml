[project]
name = "ozx-tck"
version = "0.1.0"
description = "Technology compatibility kit for RFC-9 Zipped OME-Zarr .ozx files"
readme = "README.md"
authors = [
    { name = "Chris Barnes", email = "chris.barnes@gerbi-gmb.de" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ozx-tck = "ozx_tck.main:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.2.0",
    "ruff>=0.14.9",
]
